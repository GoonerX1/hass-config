radarr_add_movie:
  url: "http://192.168.34.206:7878/api/v3/movie"
  method: POST
  headers:
    X-Api-Key: !secret radarr_api
  content_type: "application/json"
  payload: "{{ payload }}"

radarr_quality_profiles:
  url: "http://192.168.34.206:7878/api/v3/qualityprofile"
