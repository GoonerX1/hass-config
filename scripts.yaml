sonarr_search:
  alias: 'Sonarr: search for a TV show'
  description: Searches Sonarr for a TV show by title and returns candidate matches
    with their tvdbId, year, and overview.
  fields:
    term:
      description: The show title to search for
      example: Foundation
      selector:
        text:
  sequence:
  - action: rest_command.sonarr_lookup
    data:
      term: '{{ term }}'
    response_variable: lookup_result
  - stop: ''
    response_variable: lookup_result
sonarr_add:
  alias: 'Sonarr: add a TV show'
  description: 'Adds a TV show to Sonarr by tvdbId (obtained from Sonarr: search for
    a TV show). Uses the HD - 720p/1080p quality profile and monitors + searches for
    the first season.'
  fields:
    tvdb_id:
      description: The tvdbId of the show to add, from a prior search
      example: 457173
      selector:
        number:
    title:
      description: The show's title, for confirmation
      example: I Will Find You
      selector:
        text:
  sequence:
  - action: rest_command.sonarr_add_series
    data:
      payload: "{{ {\n  \"title\": title,\n  \"tvdbId\": tvdb_id | int,\n  \"qualityProfileId\":
        6,\n  \"rootFolderPath\": \"/data/ds/tvshows\",\n  \"monitored\": true,\n
        \ \"seasonFolder\": true,\n  \"addOptions\": {\"searchForMissingEpisodes\":
        true}\n} | tojson }}"
    response_variable: add_result
  - stop: ''
    response_variable: add_result
radarr_search:
  alias: 'Radarr: search for a movie'
  description: Searches Radarr for a movie by title and returns candidate matches
    with their tmdbId, year, and overview.
  fields:
    term:
      description: The movie title to search for
      example: Dune
      selector:
        text:
  sequence:
  - action: rest_command.radarr_lookup
    data:
      term: '{{ term }}'
    response_variable: lookup_result
  - stop: ''
    response_variable: lookup_result
radarr_add:
  alias: 'Radarr: add a movie'
  description: 'Adds a movie to Radarr by tmdbId (obtained from Radarr: search for
    a movie). Uses the HD - 720p/1080p quality profile and monitors + searches for
    it.'
  fields:
    tmdb_id:
      description: The tmdbId of the movie to add, from a prior search
      example: 438631
      selector:
        number:
    title:
      description: The movie's title, for confirmation
      example: Dune
      selector:
        text:
  sequence:
  - action: rest_command.radarr_add_movie
    data:
      payload: "{{ {\n  \"title\": title,\n  \"tmdbId\": tmdb_id | int,\n  \"qualityProfileId\":
        6,\n  \"rootFolderPath\": \"/data/ds/movies\",\n  \"monitored\": true,\n  \"addOptions\":
        {\"searchForMovie\": true}\n} | tojson }}"
    response_variable: add_result
  - stop: ''
    response_variable: add_result
